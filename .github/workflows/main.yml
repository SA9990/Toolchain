name: 🤖 Clang_Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Provide AOSP Clang Toolchain URL"
        required: true
        type: string
        default: ""

env:
  TZ: Asia/Kolkata
  # Use GH_PAT if you’re uploading to another repo; otherwise, GITHUB_TOKEN is fine
  GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  download_and_release_toolchain:
    runs-on: ubuntu-latest
    name: 🧰 Download and Upload Clang Toolchain

    steps:
      - name: 📅 Set build date
        run: echo "DATE=$(date +'%d-%m-%Y')" >> $GITHUB_ENV

      - name: 🌐 Download AOSP Clang Toolchain
        run: |
          echo "Downloading from: ${{ inputs.url }}"
          wget -q --show-progress -c "${{ inputs.url }}"

      - name: 🔍 Extract filename and tag
        run: |
          FILE=$(basename "${{ inputs.url }}")
          TAG="${FILE%.tar.gz}"
          echo "file=$FILE" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_ENV
          echo "Using tag: ${TAG}-${DATE}"

      - name: 📦 Upload toolchain to GitHub Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: "${{ env.tag }}"
          name: "Toolchain"
          body: |
            ## 📦 AOSP Clang Toolchain Release
            - **Source:** `${{ inputs.url }}`
            - **Build Date:** `${{ env.DATE }}`
            - **Filename:** `${{ env.file }}`

            ---
            This release contains the prebuilt AOSP Clang toolchain for kernel builds.
          files: "${{ env.file }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: ✅ Summary
        run: |
          echo "Release created successfully!"
          echo "Tag: ${{ env.tag }}-${{ env.DATE }}"
          echo "File: ${{ env.file }}"
